name: CWV Monitoring

on:
  schedule:
    # Run daily at 7 AM UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: roadie-monitoring-snapshots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Prepare snapshot history
        run: bash scripts/monitoring-snapshot-state.sh prepare

      - name: Run CWV monitor
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          CWV_SNAPSHOT_DIR: ${{ runner.temp }}/roadie-monitoring-state/data/cwv-snapshots
        run: |
          python scripts/cwv_monitor.py --snapshot --report --alert

      - name: Publish CWV snapshot
        run: bash scripts/monitoring-snapshot-state.sh publish cwv
