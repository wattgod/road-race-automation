name: Run Tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          # Install the real dependency set — a hand-maintained package list
          # here is how gravel-race-automation's CI silently ran red for
          # three months (missing deps killed pytest at collection)
          pip install -r requirements.txt

      # tests/test_race_debrief_playwright.py drives the page in Chromium;
      # without the browser it skips (as it does in Regression Tests).
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: python -m playwright install chromium
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Validate citations
        run: |
          python scripts/validate_citations.py

      - name: Check citation quality
        run: |
          python scripts/audit_citation_quality.py 2>&1 | tail -20

