name: GSC Monitoring

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: roadie-monitoring-snapshots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth

      - name: Prepare snapshot history
        run: bash scripts/monitoring-snapshot-state.sh prepare

      - name: Capture GSC snapshot
        shell: bash
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SNAPSHOT_DIR: ${{ runner.temp }}/roadie-monitoring-state/data/gsc-snapshots
        run: |
          umask 077
          credentials_file=$(mktemp "$RUNNER_TEMP/gsc-creds.XXXXXX")
          trap 'rm -f "$credentials_file"' EXIT
          printf '%s' "$GSC_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          unset GSC_SERVICE_ACCOUNT_JSON
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_file"
          python scripts/gsc_tracker.py --snapshot

      - name: Report GSC trends and alerts
        env:
          GSC_SNAPSHOT_DIR: ${{ runner.temp }}/roadie-monitoring-state/data/gsc-snapshots
        run: python scripts/gsc_tracker.py --report --alert

      - name: Publish GSC snapshot
        run: bash scripts/monitoring-snapshot-state.sh publish gsc
