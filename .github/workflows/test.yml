name: Run Tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          # Install the real dependency set — a hand-maintained package list
          # here is how gravel-race-automation's CI silently ran red for
          # three months (missing deps killed pytest at collection)
          pip install -r requirements.txt

      # tests/test_race_debrief_playwright.py drives the page in Chromium;
      # without the browser it skips (as it does in Regression Tests). The
      # cache is keyed on the installed playwright version, whose browser
      # build it must match.
      - name: Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_ENV"

      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Validate citations
        run: |
          python scripts/validate_citations.py

      - name: Check citation quality
        run: |
          python scripts/audit_citation_quality.py 2>&1 | tail -20

